schema_version: '0.1'
analysis_id: pty-chi-input-discovery-2026-08-18
application:
  name: pty-chi
  summary: PyTorch-based ptychographic reconstruction package. The inspected benchmark
    runner loads a stack of diffraction intensities, an initial complex probe, object
    pixel size, and scan positions from paired HDF5 files; constructs an object buffer;
    and runs an iterative reconstruction over epochs and minibatches. The package
    API additionally supports multislice objects, multiple coherent and OPR probe
    modes, near- or far-field propagation, optional corrections and regularizers,
    CPU/GPU execution, and distributed execution.
  variants:
  - variant_id: pie
    display_name: PIE
    evidence:
    - src/ptychi/api/options/pie.py:13-16 identifies PIEReconstructorOptions as the
      PIE reconstructor.
    - scripts/run_ptychi.py:129-132 constructs PIEOptions.
  - variant_id: epie
    display_name: ePIE
    evidence:
    - src/ptychi/api/options/pie.py:68-78 defines EPIEReconstructorOptions and EPIEOptions.
    - scripts/run_ptychi.py:133-136 constructs EPIEOptions.
  - variant_id: rpie
    display_name: rPIE
    evidence:
    - src/ptychi/api/options/pie.py:81-91 defines RPIEReconstructorOptions and RPIEOptions.
    - scripts/run_ptychi.py:137-140 constructs RPIEOptions.
  - variant_id: mpie_runner_configuration
    display_name: Momentum-configured rPIE
    evidence:
    - scripts/run_ptychi.py:141-146 maps the runner's mpie selection to RPIEOptions
      with momentum and Nesterov optimizer parameters.
    notes: This is a runner configuration rather than a distinct reconstructor enum.
  - variant_id: dm
    display_name: Difference Map
    evidence:
    - src/ptychi/api/options/dm.py:12-22 defines DM options including chunk length.
    - src/ptychi/reconstructors/dm.py:28-41 describes Difference Map memory behavior
      and its lack of minibatching.
    - scripts/run_ptychi.py:151-156 constructs DMOptions.
  - variant_id: lsqml
    display_name: Least-squares maximum likelihood
    evidence:
    - src/ptychi/api/options/lsqml.py:16-27 defines LSQML noise-model options.
    - scripts/run_ptychi.py:147-150 constructs LSQMLOptions.
  - variant_id: bh
    display_name: BH gradient-descent or conjugate-gradient reconstruction
    evidence:
    - src/ptychi/api/options/bh.py:12-22 defines BH methods GD and CG.
    - scripts/run_ptychi.py:157-163 constructs BHOptions and selects GD in the benchmark
      runner.
  - variant_id: ad_ptycho
    display_name: Automatic-differentiation ptychography
    evidence:
    - src/ptychi/api/options/ad_ptychography.py:16-21 identifies the AD ptychography
      reconstructor.
    - scripts/run_ptychi.py:164-165 constructs AutodiffPtychographyOptions.
entrypoints:
- entrypoint_id: benchmark_single_run
  kind: command_line_script
  path: scripts/run_ptychi.py
  symbol: run_single
  invocation: python scripts/run_ptychi.py --dataset <key-or-stem> --algorithm <variant>
    --epochs <E> --batch-size <B>
  selected: true
  evidence:
  - scripts/run_ptychi.py:251-295 defines the single-run command-line interface.
  - scripts/run_ptychi.py:324-375 resolves and loads the dataset, builds options,
    creates PtychographyTask, and runs reconstruction.
  - scripts/run_ptychi.py:651-661 dispatches to run_single unless --modeling is present.
  confidence: high
- entrypoint_id: modeling_sweep
  kind: command_line_experiment_driver
  path: scripts/run_ptychi.py
  symbol: run_modeling
  invocation: python scripts/run_ptychi.py --modeling --datasets <...> --algorithms
    <...> --epochs <...>
  selected: true
  evidence:
  - scripts/run_ptychi.py:605-629 defines modeling-sweep options.
  - scripts/run_ptychi.py:640-643 loops over datasets, algorithms, and epoch counts.
  - scripts/run_ptychi.py:491-522 constructs one single-run subprocess per experiment.
  confidence: high
- entrypoint_id: python_task_api
  kind: python_api
  path: src/ptychi/api/task.py
  symbol: PtychographyTask
  invocation: task = ptychi.api.task.PtychographyTask(options); task.run()
  selected: true
  evidence:
  - src/ptychi/api/task.py:62-81 initializes and builds PtychographyTask.
  - src/ptychi/api/task.py:261-280 runs the configured number of epochs.
  - src/ptychi/api/options/task.py:11-24 defines the task's data, object, probe, position,
    OPR-weight, and reconstructor option groups.
  confidence: high
candidate_inputs:
- input_id: n_scan_points
  display_name: Number of diffraction patterns / scan points
  symbol: N
  classification: problem_shape
  data_type: positive integer
  units: patterns
  valid_domain:
    minimum: 1
    consistency: Must agree across data.shape[0], scan-position count, and per-position
      OPR weights.
  default_value: null
  model_input: true
  affects:
  - FLOPs
  - I/O bytes
  - memory
  - host-to-device transfers
  - minibatch iterations
  - distributed work partitioning
  - setup clustering
  exclusion_reason: null
  evidence:
  - scripts/run_ptychi.py:91-100 loads the diffraction stack and one x/y position
    pair per scan point.
  - src/ptychi/io_handles.py:56-63 indexes patterns by scan point and defines dataset
    length as len(patterns).
  - src/ptychi/reconstructors/base.py:381-388 loops over every DataLoader batch in
    every epoch.
  - src/ptychi/api/task.py:221-230 creates or expands OPR weights over data.shape[0]
    or the position count.
  - src/ptychi/reconstructors/dm.py:128-137 allocates a stored exit wave whose first
    dimension is the number of scan points.
  assumptions:
  - The leading data dimension represents independent scan positions.
  - No data-filtering stage in the inspected runner changes N after loading.
  confidence: high
  human_decision: null
- input_id: detector_shape
  display_name: Diffraction-pattern detector height and width
  symbol: '[H_d, W_d]'
  classification: problem_shape
  data_type: pair of positive integers
  units: pixels
  valid_domain:
    height_minimum: 1
    width_minimum: 1
    source: Last two dimensions of data.
  default_value: null
  model_input: true
  affects:
  - FFT FLOPs
  - pixelwise FLOPs
  - I/O bytes
  - memory
  - transfers
  - temporary wavefield sizes
  exclusion_reason: null
  evidence:
  - src/ptychi/api/options/data.py:19-23 defines the input as intensity data.
  - src/ptychi/io_handles.py:43-48 creates and shifts a valid-pixel mask with patterns.shape[-2:].
  - src/ptychi/forward_models.py:45-60 describes detector_size as a two-dimensional
    detector shape.
  - scripts/run_ptychi.py:337-338 reports data and probe shapes after loading.
  assumptions:
  - The usual runner data shape is [N, H_d, W_d].
  - Height and width should remain separate because non-square detector support exists
    in the API.
  confidence: high
  human_decision: null
- input_id: diffraction_storage_dtype
  display_name: Diffraction data storage dtype
  symbol: dtype_data
  classification: problem_shape
  data_type: numeric dtype
  units: null
  valid_domain:
    examples:
    - float16
    - float32
    - float64
    - integer detector dtype
    constraint: Must be convertible to a PyTorch tensor.
  default_value: null
  model_input: true
  affects:
  - input I/O bytes
  - host memory
  - conversion cost
  - transfer bytes
  exclusion_reason: null
  evidence:
  - scripts/run_ptychi.py:91-92 reads the complete HDF5 dp dataset into a NumPy array.
  - src/ptychi/io_handles.py:38 stores patterns using to_tensor without an explicit
    dtype argument.
  - scripts/run_ptychi.py:337 prints the loaded data dtype.
  assumptions:
  - Compute precision is represented separately because the task has an independent
    default_dtype option.
  confidence: high
  human_decision: null
- input_id: object_shape
  display_name: Object tensor shape
  symbol: '[S, H_o, W_o]'
  classification: problem_shape
  data_type: tuple of positive integers
  units: complex pixels
  valid_domain:
    n_slices_minimum: 1
    height_minimum: 1
    width_minimum: 1
  default_value: null
  model_input: true
  affects:
  - persistent memory
  - optimizer-state memory
  - constraint FLOPs
  - multislice propagation FLOPs
  - output I/O bytes
  exclusion_reason: null
  evidence:
  - src/ptychi/api/options/base.py:375-385 defines the complex object initial guess
    and optional multislice spacings.
  - src/ptychi/forward_models.py:125-127 identifies object patches with shape [batch_size,
    n_slices, h, w].
  - scripts/run_ptychi.py:171-180 derives an object shape from position geometry,
    probe shape, and extra pixels, then creates a [1, H_o, W_o] initial guess.
  - scripts/run_ptychi.py:363 reports the resulting object initial shape.
  assumptions:
  - For the benchmark runner S is fixed to 1, but the package API supports S greater
    than 1.
  - Object spatial shape is not assumed to equal detector shape.
  confidence: high
  human_decision: null
- input_id: extra_object_pixels
  display_name: Extra object-buffer padding
  symbol: P_o
  classification: execution_parameter
  data_type: nonnegative integer
  units: pixels
  valid_domain:
    minimum: 0
  default_value: 64
  model_input: false
  affects:
  - derived object shape
  - persistent memory
  - output I/O bytes
  exclusion_reason: Prefer the realized object shape [S, H_o, W_o] in the workload
    model. This runner-specific construction parameter is redundant once that shape
    is known.
  evidence:
  - scripts/run_ptychi.py:270 defines --extra-object-pixels with default 64.
  - scripts/run_ptychi.py:171-180 passes the value to get_suggested_object_size and
    allocates the object initial guess.
  assumptions:
  - Retain this parameter in run metadata so derived object dimensions can be reproduced.
  confidence: high
  human_decision: null
- input_id: probe_shape
  display_name: Probe OPR-mode, incoherent-mode, and spatial shape
  symbol: '[M_opr, M_probe, H_p, W_p]'
  classification: problem_shape
  data_type: tuple of positive integers
  units: complex samples
  valid_domain:
    opr_modes_minimum: 1
    incoherent_modes_minimum: 1
    height_minimum: 1
    width_minimum: 1
  default_value: null
  model_input: true
  affects:
  - FFT FLOPs
  - mode-summation FLOPs
  - persistent memory
  - optimizer-state memory
  - batch temporaries
  - output I/O bytes
  exclusion_reason: null
  evidence:
  - src/ptychi/api/options/base.py:681-694 specifies probe initial_guess shape as
    [n_opr_modes, n_modes, h, w].
  - src/ptychi/api/options/base.py:721-724 enforces a four-dimensional probe tensor.
  - src/ptychi/forward_models.py:130-144 gives wavefield and shifted-probe shapes
    containing batch size, probe modes, slices, and spatial dimensions.
  - src/ptychi/forward_models.py:193-197 states that low-memory mode propagates incoherent
    probe modes sequentially.
  - scripts/run_ptychi.py:102-111 expands a three-dimensional loaded probe to four
    dimensions.
  assumptions:
  - Keep M_opr and M_probe separate because they have different weighting and update
    behavior.
  - The runner normally inserts a singleton OPR dimension when the HDF5 probe has
    three dimensions.
  confidence: high
  human_decision: null
- input_id: scan_geometry
  display_name: Probe-position geometry and spatial distribution
  symbol: X[N,2]
  classification: scientific_input
  data_type: N by 2 real-valued array
  units: object pixels
  valid_domain:
    shape: '[N, 2]'
    components:
    - y position
    - x position
  default_value: null
  model_input: false
  affects:
  - derived object shape
  - patch placement
  - compact/uniform batch setup
  - position-correction work
  exclusion_reason: The exact coordinate array is scientific data rather than a compact
    scalar workload input. Capture N, realized object shape, batching mode, and whether
    position correction is active; request a geometry summary only if compact-batching
    setup or overlap-dependent behavior must be modeled.
  evidence:
  - scripts/run_ptychi.py:97-109 loads positions, converts meters to object pixels,
    and optionally centers them.
  - src/ptychi/api/task.py:215-219 stacks x/y positions into an [N,2] tensor.
  - src/ptychi/io_handles.py:71-90 uses positions and batch size to construct compact
    clusters.
  - src/ptychi/api/options/base.py:447-459 explains mapping probe positions into the
    object buffer.
  assumptions:
  - A later review may approve summaries such as x/y extent, scan-grid dimensions,
    or overlap ratio instead of the full array.
  confidence: high
  human_decision: null
- input_id: num_epochs
  display_name: Reconstruction epochs
  symbol: E
  classification: execution_parameter
  data_type: nonnegative integer
  units: epochs
  valid_domain:
    minimum: 0
  default_value: 500
  model_input: true
  affects:
  - iterations
  - FLOPs
  - data transfers
  - scheduled execution phases
  exclusion_reason: null
  evidence:
  - scripts/run_ptychi.py:268 defines --epochs with runner default 500.
  - src/ptychi/api/options/base.py:1047-1050 defines the API default as 100.
  - src/ptychi/reconstructors/base.py:377-385 loops over the selected number of epochs
    and then over the DataLoader.
  assumptions:
  - The runner default and package-API default differ; the applicable default depends
    on entrypoint.
  confidence: high
  human_decision: null
- input_id: batch_size
  display_name: Minibatch size
  symbol: B
  classification: execution_parameter
  data_type: positive integer
  units: patterns per minibatch
  valid_domain:
    minimum: 1
    effective_maximum: Usually N; the benchmark runner clamps it to N for non-PIE
      variants.
  default_value: 1000
  model_input: true
  affects:
  - minibatch iterations
  - peak memory
  - temporary tensor sizes
  - transfer sizes
  - kernel granularity
  exclusion_reason: null
  evidence:
  - scripts/run_ptychi.py:269 defines --batch-size with default 1000.
  - scripts/run_ptychi.py:195-202 forces B=1 for PIE, clamps B to N for other variants,
    and uses it as DM chunk length.
  - src/ptychi/api/options/base.py:1052-1053 defines batch size as data per minibatch.
  - src/ptychi/reconstructors/base.py:301-312 supplies batch_size to DataLoader.
  - src/ptychi/forward_models.py:121-137 shows major intermediate tensors carrying
    a batch-size dimension.
  assumptions:
  - Record effective rather than merely requested B.
  - DM ignores ordinary batch_size and processes the complete dataset in one DataLoader
    batch.
  confidence: high
  human_decision: null
- input_id: dm_chunk_length
  display_name: Difference Map chunk length
  symbol: C_dm
  classification: execution_parameter
  data_type: positive integer
  units: scan points per chunk
  valid_domain:
    minimum: 1
    maximum: N
  default_value: 1
  model_input: true
  affects:
  - peak temporary memory
  - chunk-loop iterations
  - execution time
  exclusion_reason: null
  evidence:
  - src/ptychi/api/options/dm.py:20-22 defines chunk_length and its speed/memory tradeoff.
  - src/ptychi/reconstructors/dm.py:32-40 distinguishes chunk length from unsupported
    minibatching.
  - src/ptychi/reconstructors/dm.py:116-140 constructs ceil(N/chunk_length) chunks.
  - scripts/run_ptychi.py:201-202 sets DM chunk length from the requested batch size.
  assumptions:
  - This input applies only to the DM variant but remains a field in the shared approved
    vector, with a not-applicable value for other variants.
  confidence: high
  human_decision: null
- input_id: batching_mode
  display_name: Minibatch selection mode
  symbol: mode_batch
  classification: execution_parameter
  data_type: enum
  units: null
  valid_domain:
    values:
    - RANDOM
    - COMPACT
    - UNIFORM
  default_value: RANDOM
  model_input: true
  affects:
  - setup phase
  - clustering FLOPs
  - setup memory
  - batch composition
  - optional recurring clustering phases
  exclusion_reason: null
  evidence:
  - src/ptychi/api/enums.py:9-12 defines the three batching modes.
  - src/ptychi/api/options/base.py:1055-1076 documents batching behavior and optional
    cluster updates.
  - src/ptychi/io_handles.py:71-107 builds compact batches using clustering.
  - src/ptychi/io_handles.py:131-170 runs multiple k-means trials when constructing
    compact batches.
  assumptions:
  - The benchmark runner leaves this at RANDOM.
  - COMPACT setup can depend on the full position distribution, not only N and B.
  confidence: high
  human_decision: null
- input_id: optimized_parameter_groups
  display_name: Optimized reconstruction parameters and their schedules
  symbol: G_opt
  classification: algorithm_parameter
  data_type: structured set of booleans and epoch ranges
  units: null
  valid_domain:
    groups:
    - object
    - probe
    - probe positions
    - OPR mode weights
    - slice spacings
    schedule_fields:
    - start
    - stop
    - stride
  default_value:
    base_parameter_optimizable: true
    start: 0
    stop: null
    stride: 1
  model_input: true
  affects:
  - backward/update FLOPs
  - optimizer-state memory
  - gradient memory
  - per-epoch execution phases
  exclusion_reason: null
  evidence:
  - src/ptychi/api/options/base.py:89-130 defines optimization start, stop, and stride
    behavior.
  - src/ptychi/api/options/base.py:141-167 defines optimizable, optimizer, step size,
    and optimizer parameters.
  - src/ptychi/forward_models.py:71-76 registers only parameters marked optimizable.
  - scripts/run_ptychi.py:182-193 enables object optimization, conditionally enables
    probe optimization, and disables position optimization.
  - scripts/run_ptychi.py:273 and 357 expose --fixed-probe as the runner control.
  assumptions:
  - The workload model should encode active groups and schedule counts, not optimizer
