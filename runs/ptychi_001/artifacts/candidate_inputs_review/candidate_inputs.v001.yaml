requested_decisions:
- decision: Approve the core workload vector.
  proposed_included_fields:
  - N
  - H_d
  - W_d
  - dtype_data
  - S
  - H_o
  - W_o
  - M_opr
  - M_probe
  - H_p
  - W_p
  - E
  - B
  - C_dm
  - mode_batch
  - G_opt
  - P_fwd
  - F_opts
  - F_enabled
  - dtype_compute
  - fft64
  - data_on_device
- decision: Confirm whether characterization is limited to the scripts/run_ptychi.py
    benchmark profile or must cover the full package API. The runner fixes single-slice
    objects, float32/complex64 computation, random batching, non-optimized positions,
    and mostly single-mode probes, while the API exposes substantially broader shapes
    and phases.
- decision: Confirm that algorithm identity remains outside candidate_inputs and that
    PIE, ePIE, rPIE/momentum-rPIE, DM, LSQML, BH, and AD ptychography should be modeled
    as separate application variants using the same approved input vector.
- decision: Decide whether object shape should be supplied directly or derived from
    scan-coordinate extents, probe shape, and extra_object_pixels. Direct realized
    shape is recommended to avoid embedding runner-specific construction logic.
- decision: Decide whether exact scan geometry needs compact summaries such as x/y
    extent, scan-grid dimensions, overlap ratio, or clustering cost indicators. Exact
    coordinates are currently excluded from the scalar workload vector.
- decision: Decide whether optional features should be expanded into individual model
    inputs. Deep image priors, synthesis dictionary learning, position correction,
    multislice regularization, and probe/object constraints can introduce materially
    different execution phases.
- decision: Confirm whether input loading and output saving are in end-to-end scope.
    Dataset paths and save controls are excluded from the intrinsic workload vector,
    but their realized byte volumes and transfer phases may need separate I/O models.
- decision: Confirm whether compute precision is part of the workload vector or belongs
    solely to the platform experiment configuration. It is provisionally included
    because it changes tensor bytes and FFT implementation.
- decision: Confirm whether distributed rank count and device type should remain platform/deployment
    parameters. They are excluded from the intrinsic application input vector even
    though they affect per-rank memory, transfers, and runtime.
- decision: 'Validate variant-specific applicability: ordinary B is ineffective for
    DM, C_dm is DM-specific, PIE is forced to B=1 by the inspected runner, and some
    optional features are supported only by selected variants.'
- decision: No repository implementation claim in this draft relies on the retrieved
    literature. If domain validation is desired, source:108600537.pdf:p0002:parent001:child001
    (108600537.pdf, page 2) supports, subject to human PDF verification, the general
    terminology of a frame stack, measurement geometry, and iterative phase retrieval;
    it does not prove any pty-chi implementation detail.
