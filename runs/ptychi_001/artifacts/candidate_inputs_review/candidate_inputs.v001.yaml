    wavelength_m: Positive real in meters
    slice_spacings_m: S-1 spacing values for a multislice object
  default_value:
    free_space_propagation_distance_m: infinity
    wavelength_m: 1.0e-09
    slice_spacings_m: null
  model_input: true
  affects:
  - FFT and propagation FLOPs
  - temporary memory
  - number of propagation phases
  exclusion_reason: null
  evidence:
  - src/ptychi/api/options/data.py:25-29 defines propagation distance and wavelength.
  - src/ptychi/api/options/base.py:380-385 defines multislice spacings.
  - src/ptychi/forward_models.py:163-164 states that the planar forward model supports
    multislice propagation.
  - src/ptychi/forward_models.py:179-197 documents wavelength, near/far-field distance,
    padding, and low-memory mode.
  assumptions:
  - S in object_shape captures the dominant multislice loop bound; this field identifies
    the propagation regime and spacing-dependent phase.
  - Detector pixel size is present in data options but was not observed being passed
    into PtychographyDataset by PtychographyTask in src/ptychi/api/task.py:170-177.
  confidence: high
  human_decision: null
- input_id: forward_model_memory_options
