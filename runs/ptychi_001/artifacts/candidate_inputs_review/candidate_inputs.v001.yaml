  - Optimizer identity may require a separate reviewed field if Adam-like state and
    update operations are exercised.
  confidence: high
  human_decision: null
- input_id: forward_propagation_configuration
  display_name: Propagation regime and multislice spacing configuration
  symbol: P_fwd
  classification: scientific_input
  data_type: structured
  units: null
  valid_domain:
    free_space_propagation_distance_m: Positive finite value for near-field or infinity
