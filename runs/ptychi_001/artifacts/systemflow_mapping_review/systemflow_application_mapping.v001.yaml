schema_version: systemflow-application-mapping-0.1
status: awaiting_human_review
application_id: pty-chi
component_name: pty_chi_reconstruction
model_input_mapping:
  scan_point_count:
    source: component.parameters
    key: scan_point_count_patterns
    transform: int
    rationale: No existing SystemFlow message contract is evidenced. The component
      parameter explicitly represents the number of diffraction patterns or scan points,
      preserving the fitted model's pattern-count semantics.
    evidence:
    - approved_resource_model_contract.model_inputs includes scan_point_count.
    - approved_characterization.candidate_inputs[n_scan_points] defines N as a positive
      integer measured in patterns.
    - No SystemFlow-facing message field or property for scan-point count is supplied.
  detector_shape:
    source: component.parameters
    key: detector_shape_pixels
    transform: tuple_int
    rationale: The fitted input is a two-dimensional detector shape. A unit-bearing
      component parameter avoids inventing an upstream message field and preserves
      detector height and width separately.
    evidence:
    - approved_resource_model_contract.model_inputs includes detector_shape.
    - approved_characterization.candidate_inputs[detector_shape] defines [H_d, W_d]
      as a pair of positive integers in pixels.
    - approved_resource_model_contract.supported_domain separately specifies detector_height
      and detector_width.
  num_epochs:
    source: component.parameters
    key: reconstruction_epoch_count_epochs
    transform: int
    rationale: Epoch count is an execution parameter of the modeled component, and
      no upstream SystemFlow message field is evidenced.
    evidence:
    - approved_resource_model_contract.model_inputs includes num_epochs.
    - approved_characterization.candidate_inputs[num_epochs] defines E as a nonnegative
      integer measured in epochs.
    - scripts/run_ptychi.py:268 is cited as defining the selected runner's --epochs
      argument.
  batch_size:
    source: component.parameters
    key: minibatch_size_patterns_per_minibatch
    transform: int
    rationale: The fitted input represents effective patterns per minibatch. It is
      mapped to a unit-bearing component parameter because no existing message contract
      is evidenced.
    evidence:
    - approved_resource_model_contract.model_inputs includes batch_size.
    - approved_characterization.candidate_inputs[batch_size] defines B as a positive
      integer in patterns per minibatch.
    - The characterization states that effective rather than merely requested batch
      size should be recorded.
group_mapping:
  accelerator:
    source: component.parameters
    key: accelerator_model
    transform: str
    rationale: Accelerator is a fitted-model group selector rather than a scientific
      model input. A component parameter selects the applicable hardware-specific
      fitted group.
    evidence:
    - approved_resource_model_contract.grouping includes accelerator.
    - experiment_plan_context.hardware_targets identifies accelerator GH200.
    - approved_characterization.candidate_inputs[device_class] excludes hardware selection
      from the intrinsic workload vector.
  algorithm:
    source: component.parameters
    key: algorithm_group
    transform: str
    rationale: Algorithm is a fitted-model group selector rather than a scientific
      input. The application-neutral selector key chooses among fitted algorithm groups
      without requiring a domain-specific adapter.
    evidence:
    - approved_resource_model_contract.grouping includes algorithm.
    - experiment_plan_context.algorithm_groups identifies the fitted algorithm group
      pie.
    - The approved characterization treats reconstructors as separate model groups
      sharing an approved input vector.
output_mapping:
  avg_power_w:
    destination: host.properties
    key: application_avg_power_w
    rationale: Average power is a host resource and energy-use characteristic. The
      key preserves watts.
  energy_j:
    destination: host.properties
    key: application_energy_j
    rationale: Energy consumption is a host resource characteristic. The key preserves
      joules.
  latency_s:
    destination: message.properties
    key: application_latency_s
    rationale: Predicted application latency affects downstream timing and therefore
      belongs in message properties. The key preserves seconds.
  peak_memory_mib:
    destination: host.properties
    key: application_peak_memory_mib
    rationale: Peak memory is a host resource requirement. The key preserves mebibytes.
  throughput_per_s:
    destination: host.properties
    key: application_throughput_per_s
    rationale: Throughput is fitted performance metadata associated with execution
      on the selected host group. The key preserves inverse seconds.
metadata_output_key: application_resource_model_metadata
assumptions:
- No existing SystemFlow graph contract for these inputs or grouping selectors is
  evidenced, so all inputs and selectors use component.parameters.
- The component configuration will provide realized values rather than infer them
  from application files or domain-specific messages.
- detector_shape_pixels is represented in height-width order as [detector_height,
  detector_width].
- minibatch_size_patterns_per_minibatch is the effective batch size seen by the fitted
  profile, not merely a requested command-line value.
- The fitted model is currently supported only at scan_point_count=64, detector_shape=[64,64],
  num_epochs=2, and batch_size=1.
- The currently evidenced fitted groups are accelerator_model=GH200 and algorithm_group=pie.
- The accelerator and algorithm values are selectors for fitted model groups and are
  not passed as scientific model inputs.
- throughput_per_s retains the fitted target's generic inverse-second semantics because
  the supplied contract does not define a more specific numerator such as patterns
  or epochs.
- Output keys are generic application-resource contracts; optional domain-specific
  consumers may alias them but are not required.
- The mapping does not alter, broaden, or extrapolate the fitted resource model.
requested_decisions:
- Confirm the SystemFlow component name pty_chi_reconstruction or provide the graph's
  canonical component name.
- Confirm that component.parameters is the intended source for all four fitted inputs
  and both grouping selectors, since no existing message contract was supplied.
- Confirm that detector_shape_pixels uses [height, width] ordering.
- Confirm that batch size must be the effective value after runner adjustments.
- Confirm that accelerator_model uses the exact fitted group label GH200 and algorithm_group
  uses the exact fitted group label pie.
- Define the numerator represented by throughput_per_s if downstream consumers require
  semantics more specific than inverse seconds.
- Confirm that predictions outside the singleton supported domain must be rejected
  rather than extrapolated.
- Confirm the proposed generic output keys and metadata_output_key against the target
  SystemFlow graph's property naming conventions.
