    wavelength_m: Positive real in meters
    slice_spacings_m: S-1 spacing values for a multislice object
  default_value:
    free_space_propagation_distance_m: infinity
    wavelength_m: 1.0e-09
    slice_spacings_m: null
  model_input: true
  affects:
  - FFT and propagation FLOPs
  - temporary memory
  - number of propagation phases
  exclusion_reason: null
  evidence:
  - src/ptychi/api/options/data.py:25-29 defines propagation distance and wavelength.
