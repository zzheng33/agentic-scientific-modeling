synthetic_input_requirements:
  can_be_generated: 'yes'
  requirements:
  - shape: Diffraction intensity tensor [N,H_d,W_d].
    dtype: Any numeric dtype accepted by torch.as_tensor and consistent with dtype_data.
    value_distribution: Finite, nonnegative intensity values; include nonzero signal
      to avoid degenerate probe rescaling, normalization, and noise-model operations.
    metadata: Wavelength and free-space propagation distance from P_fwd; valid-pixel
      mask is optional and otherwise defaults to [H_d,W_d] all true.
    semantic_constraints: Leading dimension must equal N. Detector dimensions must
      not exceed the simulated probe-wavefield dimensions when detector cropping is
      required.
  - shape: Complex probe tensor [M_opr,M_probe,H_p,W_p].
    dtype: Complex counterpart of dtype_compute after task conversion.
    value_distribution: Finite complex illumination with nonzero power; multiple modes
      should not be identical if mode-specific paths are being validated.
    metadata: Object pixel size is required by propagator construction; the runner
      reads it from an HDF5 object attribute.
    semantic_constraints: For DM and BH, use M_opr=1. Probe power must be nonzero
      when normalization or power constraints are enabled.
  - shape: Complex object tensor [S,H_o,W_o].
    dtype: Complex counterpart of dtype_compute.
    value_distribution: Finite complex transmission values; a unit-amplitude initial
      object matches the inspected runner.
    metadata: For S>1, provide exactly S-1 slice spacings through P_fwd.
    semantic_constraints: The spatial object extent must contain every H_p-by-W_p
      patch implied by the scan geometry and interpolation padding.
  - shape: Position array [N,2] ordered as [y,x].
    dtype: Finite real values convertible to the compute dtype.
    value_distribution: Positions should cover the intended object area and include
      overlap for physically representative ptychography.
    metadata: Coordinates are in object pixels for the API; the runner converts meter-valued
      coordinates using object pixel size.
    semantic_constraints: All requested patches, including F_opts.pad_for_shift, must
      fit the object representation. COMPACT and UNIFORM batching require nondegenerate
      spatial geometry.
  - shape: Optional OPR weights [N,M_opr].
    dtype: Real compute dtype.
    value_distribution: Finite weights; LSQML requires nonprincipal-mode weights not
      all be approximately zero when M_opr>1.
    metadata: May be omitted for M_opr=1, in which case the task creates [N,1] ones.
    semantic_constraints: First dimension must equal N and mode dimension must agree
      with M_opr.
  unresolved_requirements:
  - Optional deep-image-prior and synthesis-dictionary features require architecture,
    latent-input, dictionary-size, and sparsity metadata not represented in the approved
    vector.
  - A portable synthetic geometry recipe cannot be derived from N, object shape, and
    probe shape alone because overlap and scan distribution are excluded.
  - The precise supported combinations of S, M_opr, M_probe, G_opt, and F_enabled
    differ by reconstructor and must be validated per model group.
  - Near-field synthetic data should be generated consistently with wavelength, propagation
    distance, object pixel size, detector sampling, and fft_shift settings; detector
    pixel size wiring requires human review.
  - Synthetic input is characterized but was not created.
