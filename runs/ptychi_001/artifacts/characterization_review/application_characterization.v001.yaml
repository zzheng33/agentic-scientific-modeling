compute_model:
  terms:
  - term_id: all_groups_forward_slice_modulation
    phase_id: forward_model
    operation: 'All model groups: complex object-wavefield modulation for each sample,
      incoherent probe mode, and object slice.'
    quantity_type: algorithmic_flops
    units: FLOPs
    expression: 6 * E * N * M_probe * S * Q
    depends_on:
    - E
    - N
    - M_probe
    - S
    - Q
    assumptions:
    - One complex multiplication is counted as six real FLOPs.
    - Every epoch processes all N patterns.
    - This term excludes OPR probe synthesis, shifts, propagation, detector intensity
      formation, and update work.
    evidence:
    - source_type: source_code
      path: src/ptychi/forward_models.py
      line: 393
      symbol: propagate_through_object
      description: Loops over S and multiplies each slice patch into every batch and
        probe-mode wavefield.
    confidence: medium
    validation_required: true
  - term_id: all_groups_forward_multislice_fft
    phase_id: forward_model
    operation: 'All model groups supporting multislice: forward angular-spectrum propagation
      between adjacent object slices.'
    quantity_type: algorithmic_flops
    units: FLOPs
    expression: E * N * M_probe * 2 * (S - 1) * F_fft(Q)
    depends_on:
    - E
    - N
    - M_probe
    - S
    - F_fft(Q)
    assumptions:
    - Each inter-slice angular-spectrum propagation performs one FFT and one inverse
      FFT.
    - DM and BH reject S>1, so this term is zero or not applicable for those groups.
    - Transfer-function construction and pointwise multiplication are excluded.
    evidence:
    - source_type: source_code
      path: src/ptychi/forward_models.py
      line: 402
      symbol: propagate_through_object
      description: Propagates after every slice except the final slice.
    - source_type: source_code
      path: src/ptychi/propagate.py
      line: 179
      symbol: AngularSpectrumPropagator.propagate_forward
      description: Uses FFT and inverse FFT around transfer-function multiplication.
    confidence: medium
    validation_required: true
  - term_id: all_groups_forward_free_space_fft
    phase_id: forward_model
    operation: 'All model groups: propagate each exit wave from the object to the
      detector.'
    quantity_type: algorithmic_flops
    units: FLOPs
    expression: E * N * M_probe * T_free * F_fft(Q)
    depends_on:
    - E
    - N
    - M_probe
    - T_free
    - F_fft(Q)
    assumptions:
    - One forward simulation is performed per pattern and epoch.
    - DM performs this detector propagation inside its update rather than through
      the ordinary forward method, but still once per pattern and epoch.
    - LSQML epoch-zero probe-rescaling behavior still evaluates the forward model.
    evidence:
    - source_type: source_code
      path: src/ptychi/forward_models.py
      line: 572
      symbol: PlanarPtychographyForwardModel.forward
      description: Calls forward real-space and detector propagation once per forward
        evaluation.
    - source_type: source_code
      path: src/ptychi/reconstructors/dm.py
      line: 241
      symbol: apply_dm_update_to_exit_wave_chunk
      description: Propagates each revised DM chunk to the detector.
    confidence: medium
    validation_required: true
  - term_id: all_groups_detector_intensity
    phase_id: forward_model
    operation: 'All model groups: squared complex magnitude and incoherent-mode summation
      before detector cropping.'
    quantity_type: algorithmic_flops
    units: FLOPs
    expression: E * N * Q * (3 * M_probe + M_probe - 1)
    depends_on:
    - E
    - N
    - Q
    - M_probe
    assumptions:
    - A squared complex magnitude is modeled as two multiplications plus one addition.
    - Summing M_probe real intensities requires M_probe-1 additions.
