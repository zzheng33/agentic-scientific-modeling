execution:
  mode: dry_run
  max_total_runs: 100
  skip_existing: true
  allow_rerun: false
  runner_status: blocked_until_approval
  run_count_formula: 8 algorithm groups * 4 shared base points * 1 hardware target
    * 3 measured repetitions = 96 measured runs
  warmup_accounting: One warmup per algorithm-group/base-point/hardware combination
    is planned but is not included in the supplied measured-run formula.
  application_execution_profile:
    device_class: cuda
    distributed_world_size: 1
    determinism_settings:
      random_seed: 20260818
      allow_nondeterministic_algorithms: false
    input_preprocessing_controls:
      center_positions: true
      scale_probe: true
      fft_shift: true
    output_save_control:
      save: true
      path_template: outputs/{plan_id}/{algorithm_group_id}/{point_id}/rep-{repetition}.npz
    power_monitoring_options:
      vendor: nvidia
      interval_seconds: 0.2
      devices: scheduler-visible allocated accelerator
  operational_assumptions:
  - 'Use the validated GH200 environment in gh200_environment.md: module path /soft/modulefiles,
    cuda/12.9.1, conda/nvidia/suse15.6/2025.01-11, and ptychopinn_torch_arm.'
  - When pty-chi is not installed, prepend /home/zhong.zheng/pty-chi/src to PYTHONPATH.
  - Do not force CUDA_VISIBLE_DEVICES=0; preserve Cobalt allocation visibility.
  - Run import, CUDA-availability, device-name, free-memory, and small tensor-allocation
    preflights inside the allocated node.
  - Use Cobalt qsub.py with the gpu_gh200 queue for the eventual reviewed script;
    no job is submitted in dry-run mode.
  - The eventual measured application invocation must not pass the application's --dry-run
    option because that would skip reconstruction.
