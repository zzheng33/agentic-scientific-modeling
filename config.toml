[openai]
api_key = "zhong.zheng"
base_url = "https://apps.inside.anl.gov/argoapi/v1"
model = "GPT-5.6 Sol"
reasoning_effort = "medium"

[agent]
max_tool_rounds = 10

[characterization.rag]
# Local ptychography papers used as supporting evidence during characterization.
# Accepted formats: PDF, Markdown, and plain text.
enabled = true
corpus_path = "knowledge/ptychography/papers"
index_path = "knowledge/ptychography/index"
embedding_model = "BAAI/bge-m3"
reranker_model = "BAAI/bge-reranker-v2-m3"
top_k = 6
parent_chunk_chars = 6000
child_chunk_chars = 1200
child_overlap_chars = 180
max_context_chars = 12000
parent_context_chars = 2600
# First-stage BM25 and HNSW candidate counts.
bm25_top_n = 50
dense_top_n = 50
fusion_top_n = 50
rerank_top_n = 15
rrf_offset = 60
# Reciprocal-rank fusion weights for exact terms and BGE-M3 dense retrieval.
bm25_weight = 0.55
dense_weight = 0.45
# HNSW cosine index parameters.
hnsw_m = 16
hnsw_ef_construction = 200
hnsw_ef_search = 96
# Local model inference limits.
embedding_batch_size = 8
embedding_max_length = 8192
reranker_batch_size = 8
reranker_max_length = 2048
# Set true on a compatible CUDA GPU; false is portable to CPU/macOS.
use_fp16 = false
# Higher values favor relevance; lower values increase source diversity.
diversity_lambda = 0.82
same_parent_penalty = 0.12
max_children_per_paper = 3

[workflow]
# Active workflow used by ./agentic status, resume, and continue.
id = "ptychi_001"

[application]
# Absolute path, or a path relative to this config file.
path = "../pty-chi/"

[[machine]]
# Accelerator is the machine identity. Repeat this table for each JLSE target.
accelerator = "GH200"
queue = "gpu_gh200"
nodes = 1
walltime_minutes = 30
module_path = "/soft/modulefiles"
modules = ["cuda/12.9.1", "conda/nvidia/suse15.6/2025.01-11"]
conda_env = "ptychopinn_torch_arm"
remote_monitor_script = "/home/zhong.zheng/PtychoPINN/scripts/monitor_gpu_power.py"
device = "cuda"
power_vendor = "nvidia"
devices = "0"
power_interval_s = 0.2

[planner]
characterization_path = "agents/characterization/output/application_characterization.yaml"
output_path = "agents/planner/output"
max_tool_rounds = 40
max_total_runs = 100
repetitions = 3

[planner.rag]
# JLSE scripts and validated runbooks used as operational planning evidence.
# This index is independent from the characterization paper index.
enabled = false
corpus_path = "knowledge/jlse/runbooks"
index_path = "knowledge/jlse/index"
embedding_model = "BAAI/bge-m3"
reranker_model = "BAAI/bge-reranker-v2-m3"
top_k = 6
parent_chunk_chars = 4000
child_chunk_chars = 900
child_overlap_chars = 120
max_context_chars = 10000
parent_context_chars = 2200
bm25_top_n = 30
dense_top_n = 30
fusion_top_n = 30
rerank_top_n = 15
rrf_offset = 60
bm25_weight = 0.55
dense_weight = 0.45
hnsw_m = 16
hnsw_ef_construction = 200
hnsw_ef_search = 64
embedding_batch_size = 8
embedding_max_length = 8192
reranker_batch_size = 8
reranker_max_length = 2048
use_fp16 = false
diversity_lambda = 0.82
same_parent_penalty = 0.12
max_children_per_paper = 3

[remote_executor]
enabled = true
host = "zhong.zheng@login.jlse.anl.gov"
# Console responses used only while opening the reusable SSH control master.
# ssh_password is stored as plaintext in this file; keep the file private.
ssh_password = "9900"
ssh_duo_choice = "1"
remote_runs_root = "/home/zhong.zheng/agentic-runs"
# Used only when upload_application=false. By default the reviewed local source
# is packaged with the two approved scripts.
remote_application_path = "/home/zhong.zheng/pty-chi"
upload_application = true
poll_interval_s = 15
poll_timeout_s = 3600
qsub_command = "qsub"
qstat_command = "qstat"
continue_on_error = true

[systemflow]
path = "../systemflow"
