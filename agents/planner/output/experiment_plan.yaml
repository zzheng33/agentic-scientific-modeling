    "summary": "Reduced 12-point pilot for fitting end-to-end performance and accelerator-energy models for the approved pty-chi PIE path on one A100. The design sweeps R, N, and I over assumed pilot domains and uses a matched three-level check to verify that requested batch size B is invariant because PIE forces an effective batch size of one."
