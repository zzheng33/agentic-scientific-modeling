  "objective": {
    "predict": [
      "end-to-end latency",
      "accelerator power",
      "accelerator energy",
      "throughput",
      "peak accelerator memory"
    ],
    "as_function_of": [
      "R",
      "N",
      "B",
      "I"
    ],
    "system_boundary": "The selected boundary is scripts/run_ptychi.py invoked with --algorithm pie and --no-save-output on an accelerator, using square R-by-N-by-N diffraction data, a planar object, far-field Fourier propagation, one coherent probe mode, and one OPR mode. The four workload model inputs requested by review are number of images R, resolution N, requested batch size B, and reconstruction iterations I. The CLI calls iterations epochs. PIE overrides B and executes one image per minibatch, so B is retained as a requested model input but does not change the selected implementation's leading FLOPs, total transferred payload, or actual batch size.",
    "intended_use": "Fit an initial system-level model for the selected pty-chi PIE implementation on an A100, quantify setup and iterative scaling with R, N, and I, and empirically verify the characterized invariance to requested batch size B."
  },
